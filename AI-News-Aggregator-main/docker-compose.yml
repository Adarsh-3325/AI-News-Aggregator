version: '3.8'

services:
  # ==========================================================
  # Relational Database: PostgreSQL 16
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: ai-news-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_aggregator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-news-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d news_aggregator"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # 100% Python FastAPI Backend + LangGraph Agent + ChromaDB
  # ==========================================================
  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-news-fastapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://news_user:news_password@postgres:5432/news_aggregator
      - CHROMA_PERSIST_DIR=/app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db
    ports:
      - "8000:8000"
    networks:
      - ai-news-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================
  # Frontend: React 19 + Vite UI
  # ==========================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-news-frontend
    restart: unless-stopped
    depends_on:
      - fastapi-backend
    ports:
      - "80:80"
    networks:
      - ai-news-network

volumes:
  postgres_data:
  chroma_data:

networks:
  ai-news-network:
    driver: bridge
