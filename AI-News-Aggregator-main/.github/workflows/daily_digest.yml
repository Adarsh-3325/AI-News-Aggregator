name: Automated AI News Intelligence & Email Digest

on:
  # Runs automatically every day at 11:00 PM IST (17:30 UTC)
  schedule:
    - cron: '30 17 * * *'
  
  # Allows manual triggering anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Run Autonomous News Pipeline & Dispatch Email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Intelligence Pipeline
        env:
          ENVIRONMENT: production
          DATABASE_URL: "sqlite:///./news_aggregator.db"
          CHROMA_PERSIST_DIR: "./chroma_db"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_HOST: "smtp.gmail.com"
          EMAIL_PORT: 587
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          python main.py
