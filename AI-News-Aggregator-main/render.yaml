services:
  # ==========================================================
  # 100% Python FastAPI Backend + Agentic Intelligence & Email Digest
  # ==========================================================
  - type: web
    name: ai-news-aggregator
    runtime: python
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: ./start.sh
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: "sqlite:///./news_aggregator.db"
      - key: CHROMA_PERSIST_DIR
        value: "./chroma_db"
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: BRAVE_API_KEY
        sync: false


