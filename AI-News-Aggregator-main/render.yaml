services:
  # ==========================================================
  # 100% Python FastAPI Backend + Agentic Intelligence & Email Digest
  # Deploys the application as a Docker web service
  # ==========================================================
  - type: web
    name: ai-news-aggregator
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: "sqlite:///./news_aggregator.db"
      - key: CHROMA_PERSIST_DIR
        value: "./chroma_db"
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: BRAVE_API_KEY
        sync: false

