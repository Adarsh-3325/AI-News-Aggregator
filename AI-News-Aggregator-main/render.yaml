services:
  # ==========================================================
  # 100% Python FastAPI Backend + Agentic Intelligence & Email Digest
  # ==========================================================
  - type: web
    name: ai-news-aggregator
    runtime: python
    buildCommand: python -c "import os; [os.chdir(r) for r, d, f in os.walk('.') if 'requirements.txt' in f and 'node_modules' not in r]; print('Found requirements.txt in:', os.getcwd()); os.system('pip install -r requirements.txt')" && (cd frontend 2>/dev/null || cd AI-News-Aggregator-main/frontend 2>/dev/null || cd */frontend 2>/dev/null) && npm install && npm run build
    startCommand: python -c "import os; [os.chdir(r) for r, d, f in os.walk('.') if 'start.sh' in f and 'node_modules' not in r]; os.system('./start.sh')" || uvicorn app.server:app --host 0.0.0.0 --port $PORT
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: "sqlite:///./news_aggregator.db"
      - key: CHROMA_PERSIST_DIR
        value: "./chroma_db"
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: BRAVE_API_KEY
        sync: false


